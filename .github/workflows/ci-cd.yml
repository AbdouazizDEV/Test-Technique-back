name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: article_manager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.yml << EOF
          spring:
            datasource:
              url: jdbc:postgresql://localhost:5432/article_manager
              username: postgres
              password: postgres
              driver-class-name: org.postgresql.Driver
            jpa:
              hibernate:
                ddl-auto: validate
              show-sql: false
              properties:
                hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
            sql:
              init:
                mode: never
          
          app:
            jwt:
              secret: \${JWT_SECRET:U73dsIlmL5e6wfYslsop3TsVLPGxYeE9sDOjxxGXTOo=}
              expiration: \${JWT_EXPIRATION:86400000}
          
          server:
            port: 8080
          
          springdoc:
            api-docs:
              path: /api-docs
            swagger-ui:
              path: /swagger-ui.html
          EOF
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      
      - name: Initialize database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d article_manager -f src/main/resources/db/migration/schema.sql || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d article_manager -f src/main/resources/db/migration/seed.sql || true
      
      - name: Build with Maven
        run: mvn clean compile -DskipTests
        working-directory: ./backend
      
      - name: Run tests
        run: mvn test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/article_manager
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: U73dsIlmL5e6wfYslsop3TsVLPGxYeE9sDOjxxGXTOo=
          JWT_EXPIRATION: 86400000
      
      - name: Package application
        run: mvn package -DskipTests
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: article-manager:latest
          cache-from: type=registry,ref=article-manager:buildcache
          cache-to: type=inline
