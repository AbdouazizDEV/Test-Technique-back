name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: article_manager
          MYSQL_USER: gs1user
          MYSQL_PASSWORD: gs1password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.yml << EOF
          spring:
            datasource:
              url: jdbc:mysql://localhost:3306/article_manager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
              username: gs1user
              password: gs1password
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                ddl-auto: validate
              show-sql: false
              properties:
                hibernate.dialect: org.hibernate.dialect.MySQLDialect
            sql:
              init:
                mode: never
          
          app:
            jwt:
              secret: \${JWT_SECRET:U73dsIlmL5e6wfYslsop3TsVLPGxYeE9sDOjxxGXTOo=}
              expiration: \${JWT_EXPIRATION:86400000}
          
          server:
            port: 8080
          
          springdoc:
            api-docs:
              path: /api-docs
            swagger-ui:
              path: /swagger-ui.html
          EOF
      
      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h localhost -u gs1user -pgs1password --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
      
      - name: Initialize database
        run: |
          mysql -h localhost -u gs1user -pgs1password article_manager < src/main/resources/db/migration/schema.sql || true
          mysql -h localhost -u gs1user -pgs1password article_manager < src/main/resources/db/migration/seed.sql || true
      
      - name: Build with Maven
        run: mvn clean compile -DskipTests
      
      - name: Run tests
        run: mvn test
        env:
          DB_URL: jdbc:mysql://localhost:3306/article_manager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          DB_USERNAME: gs1user
          DB_PASSWORD: gs1password
          JWT_SECRET: U73dsIlmL5e6wfYslsop3TsVLPGxYeE9sDOjxxGXTOo=
          JWT_EXPIRATION: 86400000
      
      - name: Package application
        run: mvn package -DskipTests
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: article-manager:latest
          cache-from: type=registry,ref=article-manager:buildcache
          cache-to: type=inline
