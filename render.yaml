services:
  - type: web
    name: article-manager-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400000
      - key: PORT
        value: 8080
    healthCheckPath: /api-docs
    plan: starter

databases:
  - name: article-manager-db
    databaseName: article_manager
    user: article_manager_user
    plan: starter
